<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PandaZen Finanzas</title>
    <!-- Tailwind CSS para que el diseño quede bonito y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app" class="max-w-4xl mx-auto p-4 sm:p-6">
        
        <!-- CABECERA -->
        <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🐼</span>
                <h1 class="text-xl font-bold text-slate-900">PandaZen Finanzas</h1>
            </div>
            <!-- Botón de Cerrar Sesión (inicialmente oculto si no está logueado) -->
            <button id="btnLogout" class="hidden text-sm bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-1.5 rounded-xl font-medium transition">
                Cerrar Sesión
            </button>
        </header>

        <!-- SECCIÓN DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
        <section id="authSection" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-md mx-auto mt-10">
            <h2 id="authTitle" class="text-lg font-semibold mb-4 text-center">Iniciar Sesión</h2>
            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Correo Electrónico</label>
                    <input type="email" id="authEmail" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Contraseña</label>
                    <input type="password" id="authPassword" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-xl transition">
                    Entrar
                </button>
            </form>
            <p class="text-center text-sm mt-4 text-slate-600">
                <span id="authToggleText">¿No tienes cuenta?</span> 
                <button type="button" id="authToggleBtn" class="text-emerald-600 font-semibold hover:underline ml-1">Regístrate</button>
            </p>
        </section>

        <!-- SECCIÓN PRINCIPAL DE LA APP (OCULTA HASTA QUE INICIAS SESIÓN) -->
        <main id="mainApp" class="hidden space-y-6">
            
            <!-- TARJETAS DE RESUMEN (BALANCE, INGRESOS, GASTOS) -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs uppercase font-semibold text-slate-400">Balance Total</p>
                    <p id="totalBalance" class="text-2xl font-bold text-slate-900 mt-1">0.00 €</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs uppercase font-semibold text-emerald-500">Ingresos</p>
                    <p id="totalIncome" class="text-2xl font-bold text-emerald-600 mt-1">0.00 €</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs uppercase font-semibold text-rose-500">Gastos</p>
                    <p id="totalExpenses" class="text-2xl font-bold text-rose-600 mt-1">0.00 €</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- FORMULARIO PARA AÑADIR MOVIMIENTOS -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 md:col-span-1 h-fit">
                    <h2 class="text-md font-semibold mb-4 text-slate-900">Añadir Movimiento</h2>
                    <form id="movementForm" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tipo</label>
                            <select id="movType" class="w-full px-3 py-2 border rounded-xl bg-white outline-none">
                                <option value="gasto">Gasto</option>
                                <option value="ingreso">Ingreso</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Concepto</label>
                            <input type="text" id="movConcept" required placeholder="Ej. Supermercado, Luz..." class="w-full px-3 py-2 border rounded-xl outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Monto (€)</label>
                            <input type="number" step="0.01" id="movAmount" required placeholder="0.00" class="w-full px-3 py-2 border rounded-xl outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Categoría</label>
                            <select id="movCategory" class="w-full px-3 py-2 border rounded-xl bg-white outline-none">
                                <option value="servicios">Servicios / Facturas</option>
                                <option value="comida">Comida / Supermercado</option>
                                <option value="ocio">Ocio / Varios</option>
                                <option value="nomina">Nómina / Sueldo</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-xl transition">
                            Guardar Movimiento
                        </button>
                    </form>
                </div>

                <!-- LISTA DE MOVIMIENTOS + FILTROS -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 md:col-span-2 space-y-4">
                    <h2 class="text-md font-semibold text-slate-900">Historial y Filtros</h2>

                    <!-- NUEVA ZONA DE FILTROS -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <!-- Buscador por texto -->
                        <input type="text" id="filterSearch" placeholder="Buscar concepto..." class="px-3 py-2 border rounded-xl text-sm outline-none">
                        <!-- Filtro por Tipo -->
                        <select id="filterType" class="px-3 py-2 border rounded-xl text-sm bg-white outline-none">
                            <option value="todos">Todos los tipos</option>
                            <option value="ingreso">Solo Ingresos</option>
                            <option value="gasto">Solo Gastos</option>
                        </select>
                        <!-- Filtro por Categoría -->
                        <select id="filterCategory" class="px-3 py-2 border rounded-xl text-sm bg-white outline-none">
                            <option value="todas">Todas las categorías</option>
                            <option value="servicios">Servicios</option>
                            <option value="comida">Comida</option>
                            <option value="ocio">Ocio</option>
                            <option value="nomina">Nómina</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>

                    <!-- TABLA / LISTA DE MOVIMIENTOS -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-400 uppercase text-xs">
                                <tr>
                                    <th class="p-3">Concepto</th>
                                    <th class="p-3">Categoría</th>
                                    <th class="p-3">Monto</th>
                                    <th class="p-3 text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="movementsTableBody" class="divide-y divide-slate-100">
                                <!-- Los movimientos se cargan aquí automáticamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPTS DE FIREBASE Y LÓGICA DE LA APP -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            signOut, onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, query, where, 
            onSnapshot, deleteDoc, doc, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURACIÓN DE TU PROYECTO FIREBASE
        // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCqCMljp7j2XPyZ4GoeWDJScpHEmgIvfBc",
  authDomain: "cuentas-panda-mgb.firebaseapp.com",
  projectId: "cuentas-panda-mgb",
  storageBucket: "cuentas-panda-mgb.firebasestorage.app",
  messagingSenderId: "399635180894",
  appId: "1:399635180894:web:9be92a7e815a4b9a50b3cf"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let allMovements = []; // Guardamos todos los datos aquí para filtrar localmente con rapidez

        // Referencias del DOM
        const authSection = document.getElementById('authSection');
        const mainApp = document.getElementById('mainApp');
        const authForm = document.getElementById('authForm');
        const authEmail = document.getElementById('authEmail');
        const authPassword = document.getElementById('authPassword');
        const authTitle = document.getElementById('authTitle');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const authToggleBtn = document.getElementById('authToggleBtn');
        const authToggleText = document.getElementById('authToggleText');
        const btnLogout = document.getElementById('btnLogout');
        const movementForm = document.getElementById('movementForm');
        const movementsTableBody = document.getElementById('movementsTableBody');

        // Referencias de los Filtros
        const filterSearch = document.getElementById('filterSearch');
        const filterType = document.getElementById('filterType');
        const filterCategory = document.getElementById('filterCategory');

        let isRegistering = false;

        // Cambiar entre Login y Registro
        authToggleBtn.addEventListener('click', () => {
            isRegistering = !isRegistering;
            authTitle.textContent = isRegistering ? "Crear Cuenta Nueva" : "Iniciar Sesión";
            authSubmitBtn.textContent = isRegistering ? "Registrarse" : "Entrar";
            authToggleText.textContent = isRegistering ? "¿Ya tienes cuenta?" : "¿No tienes cuenta?";
            authToggleBtn.textContent = isRegistering ? "Inicia sesión" : "Regístrate";
        });

        // Gestionar Autenticación
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = authEmail.value;
            const password = authPassword.value;
            try {
                if (isRegistering) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                alert("Error de autenticación: " + error.message);
            }
        });

        btnLogout.addEventListener('click', () => signOut(auth));

        // Observador de Estado de Sesión
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                authSection.classList.add('hidden');
                mainApp.classList.remove('hidden');
                btnLogout.classList.remove('hidden');
                loadMovements(user.uid);
            } else {
                authSection.classList.remove('hidden');
                mainApp.classList.add('hidden');
                btnLogout.classList.add('hidden');
                movementsTableBody.innerHTML = '';
                allMovements = [];
            }
        });

        // Guardar Movimiento en Firestore
        movementForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const nuevoMov = {
                tipo: document.getElementById('movType').value,
                concepto: document.getElementById('movConcept').value.trim(),
                monto: parseFloat(document.getElementById('movAmount').value),
                categoria: document.getElementById('movCategory').value,
                uid: currentUser.uid,
                fecha: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "movimientos"), nuevoMov);
                movementForm.reset();
            } catch (error) {
                alert("Error al guardar: " + error.message);
            }
        });

        // Cargar Movimientos en Tiempo Real con Firestore
        function loadMovements(uid) {
            const q = query(collection(db, "movimientos"), where("uid", "==", uid));
            onSnapshot(q, (snapshot) => {
                allMovements = [];
                snapshot.forEach((docSnap) => {
                    allMovements.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderFilteredMovements();
            });
        }

        // Aplicar Filtros y Pintar la Tabla + Tarjetas
        function renderFilteredMovements() {
            const searchText = filterSearch.value.toLowerCase();
            const typeValue = filterType.value;
            const categoryValue = filterCategory.value;

            // Filtrar los datos según lo que el usuario haya escrito o seleccionado
            const filtered = allMovements.filter(mov => {
                const matchesSearch = mov.concepto.toLowerCase().includes(searchText);
                const matchesType = (typeValue === 'todos') || (mov.tipo === typeValue);
                const matchesCategory = (categoryValue === 'todas') || (mov.categoria === categoryValue);
                return matchesSearch && matchesType && matchesCategory;
            });

            // Actualizar tarjetas de resumen globales (con todos los datos del usuario, no solo los filtrados)
            let totalB = 0, totalI = 0, totalG = 0;
            allMovements.forEach(m => {
                if (m.tipo === 'ingreso') {
                    totalI += m.monto;
                    totalB += m.monto;
                } else {
                    totalG += m.monto;
                    totalB -= m.monto;
                }
            });

            document.getElementById('totalBalance').textContent = totalB.toFixed(2) + ' €';
            document.getElementById('totalIncome').textContent = totalI.toFixed(2) + ' €';
            document.getElementById('totalExpenses').textContent = totalG.toFixed(2) + ' €';

            // Pintar la tabla con los movimientos filtrados
            movementsTableBody.innerHTML = '';
            if (filtered.length === 0) {
                movementsTableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">No se encontraron movimientos.</td></tr>`;
                return;
            }

            filtered.forEach(mov => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-medium text-slate-800">${mov.concepto}</td>
                    <td class="p-3 text-slate-500 capitalize">${mov.categoria}</td>
                    <td class="p-3 font-semibold ${mov.tipo === 'ingreso' ? 'text-emerald-600' : 'text-rose-600'}">
                        ${mov.tipo === 'ingreso' ? '+' : '-'}${mov.monto.toFixed(2)} €
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="deleteMovement('${mov.id}')" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-2.5 py-1 rounded-lg transition">Borrar</button>
                    </td>
                `;
                movementsTableBody.appendChild(tr);
            });
        }

        // Borrar movimiento
        window.deleteMovement = async function(id) {
            if (confirm("¿Seguro que quieres borrar este movimiento?")) {
                try {
                    await deleteDoc(doc(db, "movimientos", id));
                } catch (error) {
                    alert("Error al borrar: " + error.message);
                }
            }
        };

        // Escuchar cambios en los filtros para actualizar la pantalla al momento
        filterSearch.addEventListener('input', renderFilteredMovements);
        filterType.addEventListener('change', renderFilteredMovements);
        filterCategory.addEventListener('change', renderFilteredMovements);
    </script>
</body>
</html>
